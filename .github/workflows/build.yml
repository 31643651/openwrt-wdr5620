name: Build OpenWrt for TL-WDR5620 V9

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/lib/jvm /etc/mysql /etc/php
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils python3-pyelftools rsync unzip zlib1g-dev file wget

      - name: Patch and build
        run: |
          tr -d '\r' < build.sh > build.sh.new
          mv build.sh.new build.sh
          bash build.sh

      - name: List outputs
        if: always()
        run: ls -lh openwrt/bin/targets/ramips/mt7620/ 2>/dev/null || true

      - name: Upload images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-wdr5620-v9-images
          path: openwrt/bin/targets/ramips/mt7620/*.bin
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: openwrt/logs/**
          if-no-files-found: ignore
